name: Lab 4 - test, lint, artifact

on:
  push:
    branches: ['feature/**', 'main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: python -m pip install -r lab4/requirements-dev.txt
      - name: Unit tests and coverage
        working-directory: lab4
        run: python -m pytest -q --cov=sorts --cov=graph --cov=main --cov-report=term-missing --cov-fail-under=91
      - name: Static checks
        run: python -m ruff check lab4 --select E4,E7,E9,F
      - name: Generate API docs
        working-directory: lab4
        run: python -m pdoc graph.py sorts.py -o docs
      - name: Package runnable sources
        run: zip -r lab4-runnable.zip lab4 -x '*/__pycache__/*' '*/.pytest_cache/*' '*/docs/*' '*/.coverage' '*/.venv/*' '*/.idea/*'
      - uses: actions/upload-artifact@v4
        with:
          name: lab4-runnable
          path: lab4-runnable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab4-runnable
      - uses: softprops/action-gh-release@v2
        with:
          files: lab4-runnable.zip
